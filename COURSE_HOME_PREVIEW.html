*{box-sizing:border-box}
:root{--wood:#6b3f25;--orange:#ed8b25;--cream:#fff6e5}
html{background:#3b281d}
body{margin:0;background:radial-gradient(ellipse at top,#9d6b43,#4a2f20 75%);font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;color:#39271c}
.page{width:min(1120px,100%);margin:0 auto;padding:clamp(0px,1.2vw,14px)}

.canvas img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.lesson-link:focus-visible{outline:4px solid #ff9b2e;outline-offset:-4px;background:#fff8e84d}
.lesson-link:active{background:#ffb13b34;box-shadow:inset 0 0 0 4px #dc7827;transform:translateY(2px)}
.l1{left:1%;top:33.2%;width:33%;height:28.8%}
.l2{left:34.2%;top:33.0%;width:32.1%;height:29.2%}
.l3{left:66.3%;top:33.0%;width:32.8%;height:29.2%}
.l4{left:.3%;top:62.4%;width:26.6%;height:29.2%}

.toast{position:fixed;z-index:9;left:50%;bottom:18px;width:max-content;max-width:calc(100vw - 28px);transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:13px 16px;border:2px solid #d99b4a;border-radius:13px;background:#fff9eb;color:#55351f;box-shadow:0 10px 28px #1f100a77;font-size:15px;line-height:1.5;text-align:center;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{margin-left:10px;padding:3px 9px;border:0;border-radius:7px;background:#e98529;color:#fff;font-size:18px;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:560px){.page{padding:0}.canvas{border-radius:0}.lesson-link:hover{box-shadow:inset 0 0 0 2px #ef9b35d9}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
