<!doctype html><html lang="ru"><meta charset="utf-8"><title>diagnostic</title><body><pre id="out">Loading...</pre><script>
(async()=>{
 const source=await(await fetch('russian_lesson_1_COMPLETE.html',{cache:'no-store'})).text();
 const d=new DOMParser().parseFromString(source,'text/html');
 const targets=['Щётка','Щука','Щи','Щель','Заяц','Звезда','Замок'];
 const info=targets.map(target=>{
  const match=[...d.querySelectorAll('body *')].find(e=>e.children.length===0&&e.textContent.trim()===target);
  if(!match)return {target,found:false};
  let a=match;const hierarchy=[];
  for(let i=0;i<6&&a;i++,a=a.parentElement){
   hierarchy.push({tag:a.tagName,cls:a.className,id:a.id,text:a.textContent.slice(0,180),
   imgs:[...a.querySelectorAll('img')].slice(0,5).map(img=>({alt:img.alt,src:img.getAttribute('src')?.slice(0,80),cls:img.className}))});
  }
  return {target,found:true,hierarchy};
 });
 const css=d.querySelector('style')?.textContent||'';
 const scripts=[...d.querySelectorAll('script')].map(s=>({src:s.src||'',len:s.textContent.length,tail:s.textContent.slice(-320)}));
 document.getElementById('out').textContent=JSON.stringify({size:source.length,stylesLength:css.length,headCss:css.slice(0,200),targets:info,scripts},null,2);
})().catch(e=>document.getElementById('out').textContent='ERROR '+String(e));
</script></body></html>
