<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第一课 · Русский алфавит</title><style>
body{font:16px/1.6 Arial,sans-serif;margin:0;background:#fff9f0;color:#50251b}
#loading{text-align:center;padding:38px 20px}
</style></head><body><div id="loading">第一课正在加载… · Загружается урок 1…</div>
<script>
(async function(){
  // The approved original lesson is a large HTML file with embedded media.
  // Fetch and retain it exactly rather than reconstructing the design.
  const url='russian_lesson_1_original_backup_20261019.html';
  try{
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error('Lesson source HTTP '+response.status);
    const source=await response.text();
    const doc=new DOMParser().parseFromString(source,'text/html');
    // Remove the obsolete combined syllables lesson; Lesson 2 now has its
    // own approved 100-word page linked from the unchanged course homepage.
    const duplicate=doc.getElementById('combinedLesson2Shell');
    if(duplicate)duplicate.remove();
    // Keep all original alphabet scripts, local MP3s and styles.
    const correct=doc.createElement('script');
    correct.src='assets/lesson1-image-integrity-20261019.js';
    correct.defer=true;
    doc.body.appendChild(correct);
    document.open();
    document.write('<!doctype html>\n'+doc.documentElement.outerHTML);
    document.close();
  }catch(error){
    document.getElementById('loading').textContent='无法加载课程 · Ошибка загрузки урока 1: '+String(error);
    const link=document.createElement('a');
    link.href=url;link.textContent='Открыть резервную версию / 打开备份版本';
    document.getElementById('loading').appendChild(document.createElement('p')).appendChild(link);
  }
})();
</script></body></html>
