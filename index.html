<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Русский для китайцев — Урок 3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#24324a;
  background:linear-gradient(135deg,#fff7df,#eaf7ff);
  padding:20px
}

.wrap{
  width:min(1100px,100%);
  margin:auto
}

.header{
  text-align:center;
  margin:10px 0 22px
}

.header h1{
  margin:0;
  font-size:34px
}

.header p{
  margin:8px 0;
  color:#718096;
  font-size:18px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px
}

.card{
  background:#fffdf8;
  border:3px solid #24324a;
  border-radius:24px;
  box-shadow:6px 8px 0 #f2c66d;
  padding:22px;
  text-align:center;
  position:relative
}

.tape{
  display:inline-block;
  background:#f7d88a;
  padding:6px 22px;
  border-radius:4px;
  font-size:13px;
  transform:rotate(-2deg);
  margin-bottom:12px
}

.word{
  font-size:64px;
  font-weight:800;
  margin:8px 0 0
}

.pinyin{
  font-size:22px;
  color:#e28a3b;
  margin:4px 0
}

.zh{
  font-size:21px;
  margin-bottom:16px
}

.play{
  border:0;
  border-radius:999px;
  background:#5aa7e8;
  color:white;
  width:72px;
  height:72px;
  font-size:32px;
  cursor:pointer;
  box-shadow:0 5px 0 #347db8
}

.play:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #347db8
}

.hint{
  text-align:center;
  margin:24px 0;
  color:#718096;
  font-size:14px
}
</style>
</head>

<body>

<div class="wrap">

<div class="header">
<h1>Русский язык для китайцев</h1>
<p>Урок 3 · Личные местоимения · 人称代词</p>
</div>

<div class="grid">

<div class="card">
<div class="tape">Личное местоимение</div>
<div class="word">Я</div>
<div class="pinyin">Ya</div>
<div class="zh">我</div>
<button class="play" onclick="speak('Я')">🔊</button>
</div>

<div class="card">
<div class="tape">
