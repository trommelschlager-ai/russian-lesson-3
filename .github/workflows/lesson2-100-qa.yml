name: Verify 100-word lesson 2
on:
  push:
    branches:
      - feature/lesson2-complete-100-2026-10-19
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome driver
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.22.3
      - name: Validate 100 MP3 files and run responsive Chrome QA
        run: node tools/lesson2-100-qa.mjs
