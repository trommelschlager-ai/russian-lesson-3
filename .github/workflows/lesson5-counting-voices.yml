name: Build lesson 5 MP3s from existing voice recordings
on:
  push:
    branches: [feature/lesson5-numbers-1-to-100-20261023]
    paths:
      - .github/workflows/lesson5-counting-voices.yml
      - scripts/create_lesson5_number_voices.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson5-numbers-1-to-100-20261023
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install MP3 composer and format validator
        run: python -m pip install --disable-pip-version-check 'pydub>=0.25,<1' 'mutagen>=1.47,<2'
      - name: Confirm FFmpeg and FFprobe
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Compose every missing compound number MP3 from existing male recordings
        run: python scripts/create_lesson5_number_voices.py
      - name: Commit new clips and map to the separate working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/lesson5-counting assets/lesson5-numbers-audio.js
          if ! git diff --cached --quiet; then
            git commit -m "Add composed Russian number MP3 for 21 to 99"
            git push origin HEAD:feature/lesson5-numbers-1-to-100-20261023
          fi
