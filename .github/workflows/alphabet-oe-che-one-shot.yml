name: Generate corrected Russian alphabet О and Ч
on:
  push:
    paths:
      - .github/workflows/alphabet-oe-che-one-shot.yml
      - tools/rebuild-alphabet-oe-che.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice generator
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate corrected Dmitry audio, validate, and update course
        run: python tools/rebuild-alphabet-oe-che.py
      - name: Commit changed audio and lesson
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/alphabet-corrected/ audio/alphabet-natural/manifest.json lesson-1-panda-style.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate fresh Dmitry-Neural О and Ч sounds and wire alphabet lesson"
            git push
          fi
