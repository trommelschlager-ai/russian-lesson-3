name: Harmonize 33 Russian lesson 1 example words to Svetlana
on:
  push:
    paths:
      - .github/workflows/lesson1-words-unified-voice.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pronunciation tools
        run: python -m pip install --disable-pip-version-check edge-tts mutagen
      - name: Synthesize missing 33 Svetlana word recordings and validate
        run: python tools/rebuild-lesson1-word-examples.py
      - name: Commit and publish only word audio and vocabulary references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/lesson1-word-svetlana-v1/ audio/alphabet-natural/manifest.json lesson-1-panda-style.html
          if ! git diff --cached --quiet; then
            git commit -m "Make all 132 alphabet words use Svetlana voice"
            git pull --rebase
            git push
          fi
