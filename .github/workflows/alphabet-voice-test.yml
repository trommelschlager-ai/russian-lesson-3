name: Test natural Russian neural audio for alphabet
on:
  push:
    branches: [course-recovery-2026-10-16]
    paths: [VOICE_ALPHABET_TEST_TRIGGER.txt]
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Russian voice generator
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate and validate four examples
        run: |
          python - <<'PY'
          import asyncio, pathlib, subprocess
          import edge_tts
          out=pathlib.Path('audio/alphabet-neural-preview')
          out.mkdir(parents=True,exist_ok=True)
          samples=[
            ('01-dmitry-arbuz.mp3','Арбуз','ru-RU-DmitryNeural'),
            ('02-svetlana-yolka.mp3','Ёлка','ru-RU-SvetlanaNeural'),
            ('03-dmitry-a-letter.mp3','А','ru-RU-DmitryNeural'),
            ('04-svetlana-syr.mp3','Сыр','ru-RU-SvetlanaNeural'),
          ]
          async def go():
            for fn,word,voice in samples:
              p=out/fn
              for attempt in range(3):
                try:
                  await edge_tts.Communicate(word, voice,rate='-8%').save(str(p))
                  assert p.stat().st_size>1000
                  assert p.read_bytes().startswith(b'ID3') or p.read_bytes()[:2] in (b'\\xff\\xfb',b'\\xff\\xf3'), 'Invalid MP3 header'
                  print(word, voice, p.stat().st_size)
                  break
                except Exception:
                  if attempt>=2: raise
                  await asyncio.sleep(2*(attempt+1))
          asyncio.run(go())
          PY
      - name: Commit preview recordings for listening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/alphabet-neural-preview
          git diff --cached --exit-code -- index.html
          git commit -m "Create voice-quality preview for alphabet before changing 165 recordings"
          git push
