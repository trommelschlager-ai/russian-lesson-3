name: Test restored lesson 2 header and all 8 pronouns
on:
  push:
    branches: [feature/clean-lesson2-3-20261023]
    paths: [.github/workflows/clean-lesson2-3-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clean-lesson2-3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify JS parsing
        run: |
          node --check assets/lesson2-exact-layout.js
          node --check assets/lesson3-approved-20261023.js
      - name: Install Chrome engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test real HTML layout and interactions at 390 and 1360 px
        run: python scripts/test-clean-lesson2-3.py
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-lessons-2-3
          path: screenshots/*.png
          if-no-files-found: ignore
