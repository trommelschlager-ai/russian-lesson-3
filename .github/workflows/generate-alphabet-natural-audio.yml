name: Replace robotic alphabet MP3 with Russian neural voices
on:
  push:
    branches: [course-recovery-2026-10-16]
    paths: [GENERATE_ALPHABET_NATURAL_AUDIO.txt]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice generation and audio validators
        run: python -m pip install --disable-pip-version-check edge-tts mutagen
      - name: Generate recorded MP3 for every alphabet example
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,re,pathlib
          import edge_tts
          from mutagen.mp3 import MP3
          path=pathlib.Path('russian_lesson_1_COMPLETE.html')
          source=path.read_text(encoding='utf-8')
          m=re.search(r'const DATA=(\[.*?\]);\s*const COLORS=',source,re.S)
          assert m,'Alphabet data not found'
          rows=json.loads(m.group(1))
          assert len(rows)==33 and sum(len(r['examples']) for r in rows)==99
          letter_names={
            'А':'а','Б':'бэ','В':'вэ','Г':'гэ','Д':'дэ','Е':'е','Ё':'ё','Ж':'жэ',
            'З':'зэ','И':'и','Й':'и краткое','К':'ка','Л':'эль','М':'эм','Н':'эн','О':'о',
            'П':'пэ','Р':'эр','С':'эс','Т':'тэ','У':'у','Ф':'эф','Х':'ха','Ц':'цэ',
            'Ч':'че','Ш':'ша','Щ':'ща','Ъ':'твёрдый знак','Ы':'ы',
            'Ь':'мягкий знак','Э':'э','Ю':'ю','Я':'я'
          }
          assert len(letter_names)==33
          male='ru-RU-DmitryNeural'
          female='ru-RU-SvetlanaNeural'
          out=pathlib.Path('audio/alphabet-natural')
          out.mkdir(parents=True,exist_ok=True)
          tasks={}
          manifest=[]
          def add(obj,key,spoken,voice):
            signature=voice+'|'+spoken
            filename=('dmitry' if voice==male else 'svetlana')+'-'+hashlib.sha256(signature.encode('utf-8')).hexdigest()[:16]+'.mp3'
            path_str=(out/filename).as_posix()
            tasks[signature]=(spoken,voice,out/filename)
            obj[key]=path_str
            manifest.append({'field':key,'display':obj.get('word',obj.get('letter')),'spoken':spoken,'voice':'Dmitry' if voice==male else 'Svetlana','file':path_str})
          for row in rows:
            add(row,'letterAudio',letter_names[row['letter']],male)
            add(row,'wordAudio',row['word'],female)
            for j,ex in enumerate(row['examples']):
              add(ex,'audio',ex['word'],female if j%2==0 else male)
          assert len(manifest)==165
          print('Requested individual fields:',len(manifest),'unique MP3:',len(tasks),flush=True)
          gate=asyncio.Semaphore(3)
          async def generate(spoken,voice,target):
            async with gate:
              for attempt in range(1,6):
                try:
                  if target.exists() and target.stat().st_size>1500:
                    MP3(str(target))
                    return
                  await edge_tts.Communicate(spoken,voice,rate='-8%').save(str(target))
                  assert target.stat().st_size>1500
                  info=MP3(str(target)).info
                  assert .22 < info.length < 60, f'Invalid duration: {spoken}: {info.length}'
                  await asyncio.sleep(.12)
                  return
                except Exception as error:
                  if target.exists(): target.unlink()
                  if attempt==5: raise RuntimeError(f'Cannot synthesize {spoken!r}: {error}') from error
                  await asyncio.sleep(1.2*attempt)
          async def run():
            await asyncio.gather(*(generate(*entry) for entry in tasks.values()))
          asyncio.run(run())
          # Preserve approved HTML design, card text, media buttons and Chinese notes.
          reserialized=json.dumps(rows,ensure_ascii=False,separators=(',',':'))
          changed=source[:m.start(1)]+reserialized+source[m.end(1):]
          before='new Audio(dataUriToObjectUrl(recording))'
          assert changed.count(before)==1,'Audio playback script unexpectedly changed'
          changed=changed.replace(before,"new Audio(recording.startsWith('data:') ? dataUriToObjectUrl(recording) : recording)",1)
          assert changed.count('SpeechSynthesisUtterance')==0,'Browser robotic TTS must stay disabled'
          assert '"word":"Халат"' in changed and 'bathrobe-white.webp' in changed
          assert '俄语中' in changed,'Chinese alphabet explanation missing'
          path.write_text(changed,encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Generated',len(tasks),'unique neural MP3; connected all',len(manifest),'fields; HTML bytes',len(changed),flush=True)
          PY
      - name: Commit new voices and alphabet HTML together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russian_lesson_1_COMPLETE.html audio/alphabet-natural/
          git diff --cached --exit-code -- index.html
          git commit -m "Replace 165 alphabet playback slots with recorded Russian neural voices"
          git push
