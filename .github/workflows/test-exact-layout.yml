name: Test exact lesson 2 and 3 layouts
on:
  push:
    branches:
      - feature/exact-layout-lesson2-3-20261023
    paths:
      - .github/workflows/test-exact-layout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exact-layout-lesson2-3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/test-exact-layout.py
