name: Finish lesson 7 daily routine dialogue
on:
  push:
    branches: [course-recovery-2026-10-16]
    paths: [LESSON7_DIALOGUE_BUILD.txt]
permissions:
  contents: write
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check edge-tts mutagen
      - name: Add two-voice dialogue with images, text and MP3
        run: |
          python - <<'PY'
          from pathlib import Path
          import asyncio,html,json,hashlib
          import edge_tts
          from mutagen.mp3 import MP3
          page=Path('lesson-7.html')
          original=page.read_text(encoding='utf-8')
          assert original.count('<section class="quiz-invitation">')==1
          assert original.count('<script src="assets/audio-manifest.js"></script>')==1
          assert original.count('<link href="assets/illustrated.css" rel="stylesheet"/>')==1
          assert 'id="dialogue-day"' not in original
          dialogue=[
            ("Что ты делаешь утром?","Chto ty delayesh' utrom?","你早上做什么？","female","Светлана","assets/illustrated/svetlana-5.jpg"),
            ("Утром я встаю и завтракаю.","Utrom ya vstayu i zavtrakayu.","早上我起床，然后吃早餐。","male","Дмитрий","assets/illustrated/dmitry-5.jpg"),
            ("А что ты делаешь вечером?","A chto ty delayesh' vecherom?","那你晚上做什么？","female","Светлана","assets/illustrated/svetlana-5.jpg"),
            ("Вечером я учу русский язык и гуляю.","Vecherom ya uchu russkiy yazyk i gulyayu.","晚上我学俄语，还会散步。","male","Дмитрий","assets/illustrated/dmitry-5.jpg")
          ]
          for _,_,_,_,_,portrait in dialogue: assert Path(portrait).is_file(),portrait
          folder=Path('audio/lesson7-dialogue')
          folder.mkdir(parents=True,exist_ok=True)
          audio_map={}
          async def generate():
            for spoken,lat,zh,role,speaker,portrait in dialogue:
              voice='ru-RU-SvetlanaNeural' if role=='female' else 'ru-RU-DmitryNeural'
              token=hashlib.sha256((voice+'|'+spoken).encode()).hexdigest()[:16]
              clip=folder/(token+'.mp3')
              for attempt in range(4):
                try:
                  await edge_tts.Communicate(spoken,voice,rate='-8%').save(str(clip))
                  info=MP3(str(clip)).info
                  assert clip.stat().st_size>2000 and .3<info.length<25
                  break
                except Exception:
                  if clip.exists():clip.unlink()
                  if attempt==3:raise
                  await asyncio.sleep(attempt+1)
              audio_map[role+'|'+spoken]=clip.as_posix()
              print(speaker, spoken, round(info.length,2),'sec',flush=True)
          asyncio.run(generate())
          def e(s):return html.escape(s,quote=True)
          cards=[]
          for spoken,lat,zh,role,speaker,portrait in dialogue:
            cards.append(f"""<article class="day-dialogue-card">
              <img class="day-dialogue-character" src="{e(portrait)}" alt="{e(speaker)}"/>
              <div class="day-dialogue-text">
                <div class="day-dialogue-speaker">{e(speaker)}</div>
                <div class="ru" lang="ru">{e(spoken)}</div>
                <div class="latin">{e(lat)}</div>
                <div class="zh" lang="zh-CN">{e(zh)}</div>
                <button type="button" class="word-play image-button" data-role="{role}" data-say="{e(spoken)}" aria-label="听 {e(spoken)}"><img alt="" src="assets/illustrated/play-blue.jpg" width="106" height="55"/></button>
              </div>
              </article>""")
          block="""<section class="illustrated-section day-dialogue-section" aria-labelledby="lesson7-dialogue-title">
            <div class="day-dialogue-heading"><h2 id="lesson7-dialogue-title">对话练习 · Диалог «Мой день»</h2>
              <button type="button" class="day-dialogue-play-all" data-course-all="dialogue-day">🔊 全部播放 · Прослушать всё</button></div>
            <div class="day-dialogue-grid" id="dialogue-day">"""+''.join(cards)+"""</div>
          </section>"""
          stylesheet="""/* Scoped dialogue addition to approved lesson 7 layout. */
          .day-dialogue-section{padding:20px 27px 26px}
          .day-dialogue-heading{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
          .day-dialogue-heading h2{margin:0;font-size:clamp(23px,3vw,34px);color:#172b68}
          .day-dialogue-play-all{background:#f2e6fa;border:2px solid #9c69d3;border-radius:14px;padding:12px 15px;color:#5b297c;font-size:17px;font-weight:700}
          .day-dialogue-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
          .day-dialogue-card{display:grid;grid-template-columns:124px minmax(0,1fr);align-items:center;gap:14px;background:#fffdf8;border:2px solid #f0d0d5;border-radius:18px;padding:14px;min-width:0}
          .day-dialogue-character{display:block;width:124px;height:140px;object-fit:cover;border-radius:14px}
          .day-dialogue-speaker{font-weight:700;color:#a62c67;font-size:19px;margin-bottom:5px}
          .day-dialogue-card .ru{font-size:clamp(20px,2vw,27px);font-weight:700;line-height:1.28;overflow-wrap:anywhere}
          .day-dialogue-card .latin{font-size:17px;color:#53627d;margin-top:6px;line-height:1.4}
          .day-dialogue-card .zh{font-size:18px;color:#2f4e68;margin-top:6px;line-height:1.4}
          .day-dialogue-card button{margin-top:8px;border:0;background:none;padding:0}
          .day-dialogue-card button img{width:94px;height:auto}
          @media(max-width:760px){
            .day-dialogue-section{padding:14px 12px 20px}
            .day-dialogue-grid{grid-template-columns:1fr;gap:12px}
            .day-dialogue-card{grid-template-columns:100px minmax(0,1fr);gap:11px;padding:9px}
            .day-dialogue-character{width:100px;height:126px}
            .day-dialogue-card .ru{font-size:22px}
            .day-dialogue-card .latin{font-size:17px}
            .day-dialogue-card .zh{font-size:18px}
          }
          @media(max-width:360px){.day-dialogue-card{grid-template-columns:78px minmax(0,1fr)}.day-dialogue-character{width:78px;height:112px}}
          """
          csspath=Path('assets/lesson7-dialogue.css')
          assert not csspath.exists()
          csspath.write_text(stylesheet,encoding='utf-8')
          original=original.replace('<link href="assets/illustrated.css" rel="stylesheet"/>','<link href="assets/illustrated.css" rel="stylesheet"/><link href="assets/lesson7-dialogue.css" rel="stylesheet"/>',1)
          original=original.replace('<section class="quiz-invitation">',block+'<section class="quiz-invitation">',1)
          original=original.replace('<script src="assets/audio-manifest.js"></script>','<script src="assets/audio-manifest.js"></script><script src="assets/lesson7-dialogue-audio.js"></script>',1)
          page.write_text(original,encoding='utf-8')
          js='window.COURSE_AUDIO=window.COURSE_AUDIO||{};Object.assign(window.COURSE_AUDIO,'+json.dumps(audio_map,ensure_ascii=False,separators=(',',':'))+');\n'
          Path('assets/lesson7-dialogue-audio.js').write_text(js,encoding='utf-8')
          review_path=Path('content-review/lesson-7.json')
          reviewed=json.loads(review_path.read_text(encoding='utf-8'))
          assert 'dialogue' not in reviewed
          reviewed['dialogue']=[[spoken,lat,zh,role] for spoken,lat,zh,role,*_ in dialogue]
          review_path.write_text(json.dumps(reviewed,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert original.count('id="dialogue-day"')==1 and len(audio_map)==4
          print('Lesson 7: four utterances, bilingual dialogue, text and MP3 ready',flush=True)
          PY
      - name: Commit only lesson 7 and its own assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson-7.html assets/lesson7-dialogue.css assets/lesson7-dialogue-audio.js audio/lesson7-dialogue/ content-review/lesson-7.json
          git diff --cached --exit-code -- index.html
          git commit -m "Complete lesson 7 daily routine dialogue with two voices and translations"
          git push
