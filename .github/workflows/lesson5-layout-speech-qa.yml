name: QA lesson 5 numbered cards and Android speech false positives
on:
  push:
    branches: [feature/lesson5-layout-and-speech-fix-20261023]
    paths:
      - .github/workflows/lesson5-layout-speech-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson5-layout-and-speech-fix-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check JavaScript syntax
        run: node --check assets/lesson5-pronunciation-inline.js
      - name: Install test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify mobile and desktop appearance and fake Russian ASR results
        run: python scripts/check_lesson5_speech_layout.py
      - name: Preserve evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson5-first-five-cards
          path: test-screenshots/*.png
          if-no-files-found: ignore
