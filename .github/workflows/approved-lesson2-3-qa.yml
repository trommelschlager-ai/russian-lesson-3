name: QA approved lesson 2 and 3 styling
on:
  push:
    branches:
      - feature/approved-redesign-lesson2-3-20261023
    paths:
      - .github/workflows/approved-lesson2-3-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-redesign-lesson2-3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check desktop and Android-style screen
        run: python scripts/smoke_approved_lesson2_3.py
      - name: Save visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-lesson2-3-qa-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
