name: Verify approved lesson 2 and 3 reference images
on:
  push:
    branches: [feature/approved-art-assets-lesson2-3-20261023]
    paths: [.github/workflows/approved-art-visual-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-art-assets-lesson2-3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          node --check assets/lesson2-true-approved-art.js
          node --check assets/lesson3-true-approved-art.js
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test desktop and 390px Android
        run: python scripts/verify_approved_art_23.py
      - name: Upload comparison screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-lesson2-3-screenshots
          path: qa-approved-art/*.png
          if-no-files-found: ignore

# Rerun after responsive lesson 3 assertion fix and mobile header contrast fix.
