name: Import approved lesson 3 image from signed asset
on:
  push:
    branches: [feature/lesson3-bright-bubbles-20261023]
    paths: [.github/workflows/approved-lesson3-bubbles-import.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson3-bright-bubbles-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Download approved original at full resolution
        run: python scripts/import-lesson3-bubbles.py
      - name: Commit imported high quality image to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved-art/lesson3-bubbles-approved.webp
          git commit -m "Import exact approved vivid Russian pronoun bubbles artwork"
          git push origin HEAD:feature/lesson3-bright-bubbles-20261023
