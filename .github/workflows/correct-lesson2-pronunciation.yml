name: Correct seven lesson 2 syllables and flour stress
on:
  push:
    branches: [course-recovery-2026-10-16]
    paths: [.github/workflows/correct-lesson2-pronunciation.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Russian neural voice generation and audio cutters
        run: |
          python -m pip install --disable-pip-version-check edge-tts mutagen
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate stress-correct segments and repair audio map
        run: python tools/correct-lesson2-pronunciation.py
      - name: Commit only the seven sound fixes and flour label
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/lesson2-pronunciation-fixes assets/audio-manifest.js russian_lesson_2_reading.html
          git diff --cached --exit-code -- index.html
          git diff --cached --exit-code -- lesson-7.html
          git commit -m 'Correct ЛА ПО ДО КО БУ ВО and flour мука́ pronunciation in lesson 2'
          git push
