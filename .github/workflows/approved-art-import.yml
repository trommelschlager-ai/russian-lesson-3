name: Import approved lesson reference artwork
on:
  push:
    branches: [feature/approved-art-assets-lesson2-3-20261023]
    paths: [.github/workflows/approved-art-import.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-art-assets-lesson2-3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Download original approved artwork and crop banners
        run: python scripts/import-approved-art.py
      - name: Save binary assets on working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved-art/
          if ! git diff --cached --quiet; then
            git commit -m "Import exact approved lesson 2/3 artwork as local images"
            git push origin HEAD:feature/approved-art-assets-lesson2-3-20261023
          fi
