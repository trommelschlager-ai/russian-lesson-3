name: QA lesson 3 restored original card rows
on:
  push:
    branches: [feature/lesson3-restore-row-layout-20261023-v2]
    paths: [.github/workflows/qa-lesson3-original-rows.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson3-restore-row-layout-20261023-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/qa-lesson3-original-rows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson3-original-rows-screenshots
          path: qa-lesson3/*.png
          if-no-files-found: ignore
