name: Final QA approved lesson 2
on:
  push:
    branches: [feature/lesson2-final-qa-20261023]
    paths: [.github/workflows/lesson2-final-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson2-final-qa-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect every file and test page at phone, tablet and desktop
        run: python scripts/lesson2-final-qa.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson2-final-screenshots
          path: test-screenshots/*.png
          if-no-files-found: ignore
