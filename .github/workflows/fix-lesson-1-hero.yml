name: Repair lesson-1 hero image on recovery branch
on:
  push:
    branches:
      - course-recovery-2026-10-16
    paths:
      - QA_FIX_HERO.txt
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore embedded original hero image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          file = Path('russian_lesson_1_COMPLETE.html')
          source = file.read_text(encoding='utf-8')
          match = re.search(r'\.hero-art\{[^}]*?url\(&quot;(data:image/jpeg;base64,[A-Za-z0-9+/=]+)&quot;\)',source,re.DOTALL)
          assert match, 'Original embedded hero image missing'
          url = match.group(1)
          image = base64.b64decode(url.split(',',1)[1],validate=True)
          assert len(image)>10000 and image.startswith(bytes.fromhex('ffd8ff')), 'Unexpected hero image data'
          stale = 'url(&quot;__HERO__&quot;)!important'
          assert source.count(stale)==1, 'Expected exactly one hero placeholder'
          result=source.replace(stale,'url("'+url+'")!important')
          assert result.count('__HERO__')==0
          file.write_text(result,encoding='utf-8')
          print('Reused existing embedded hero image, bytes:',len(image))
          PY
      - name: Commit only the corrected lesson page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russian_lesson_1_COMPLETE.html
          git diff --cached --exit-code -- index.html
          git commit -m "Restore original alphabet hero illustration without redesign"
          git push
