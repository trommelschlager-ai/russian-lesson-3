name: Test approved lesson 3 banner only
on:
  push:
    branches: [feature/lesson3-bright-bubbles-20261023]
    paths: [.github/workflows/qa-lesson3-approved-bubbles.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson3-bright-bubbles-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/qa-lesson3-approved-bubbles.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson3-approved-bubbles-mobile-desktop
          path: screenshots/*.png
          if-no-files-found: ignore
