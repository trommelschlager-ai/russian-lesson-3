name: Check microphone in each of 7 lessons
on:
  push:
    branches: [feature/speech-check-all-seven-2026-10-19]
    paths:
      - .github/workflows/check-speech-all-seven.yml
      - tools/speech-check-seven-lessons-qa.mjs
      - assets/pronunciation-check.js
      - assets/pronunciation-lesson1-data.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test driver and Chinese fonts
        run: |
          npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.22.3
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify lessons 1 through 7 sequentially
        run: node tools/speech-check-seven-lessons-qa.mjs
