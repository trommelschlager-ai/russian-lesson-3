name: Repair alphabet reading continuation (staging only)
on:
  push:
    branches: [course-recovery-2026-10-16]
    paths: [RESTORE_READING_CONTINUATION_REQUEST.txt]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace fragile giant srcdoc iframe with same-origin lesson 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          file=Path('russian_lesson_1_COMPLETE.html')
          html=file.read_text(encoding='utf-8')
          opening='<iframe id="combinedLesson2Frame" title="Чтение и произношение"'
          assert html.count(opening)==1, 'Continuation frame was not found exactly once'
          start=html.index(opening)
          end=html.index('"></iframe>',start)+len('"></iframe>')
          original=html[start:end]
          assert 'srcdoc="' in original and len(original)>100000, 'Expected large embedded lesson 2'
          replacement='<iframe id="combinedLesson2Frame" title="Чтение и произношение" style="display:block;width:100%;height:1100px;border:0;background:#fff7f1;overflow:hidden;" loading="lazy" src="russian_lesson_2_reading.html"></iframe>'
          fallback='<p class="reading-direct-link" style="padding:12px 16px;text-align:center"><a href="russian_lesson_2_reading.html" style="display:inline-block;padding:13px 18px;border-radius:14px;background:#e6e0f7;color:#342b76;font-weight:700;text-decoration:none">🔊 第2课：阅读与发音 · Открыть урок чтения →</a></p>'
          html=html[:start]+replacement+fallback+html[end:]
          assert Path('russian_lesson_2_reading.html').is_file(),'Reading file missing'
          # Embedded lesson 2 formerly posted height messages; same-origin standalone page needs explicit sizing
          autosize="""<script>
          (function(){
            var frame=document.getElementById('combinedLesson2Frame');
            if(!frame)return;
            var watcher=null;
            function fit(){
              try{
                var doc=frame.contentDocument;
                if(!doc||!doc.body)return;
                var h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);
                if(h>100)frame.style.height=Math.max(900,Math.min(h+28,30000))+'px';
              }catch(e){/* Direct lesson 2 link remains available */}
            }
            frame.addEventListener('load',function(){
              fit();
              try{
                if(watcher)watcher.disconnect();
                var doc=frame.contentDocument;
                if(doc&&doc.body&&window.ResizeObserver){
                  watcher=new ResizeObserver(fit);watcher.observe(doc.body);
                }
              }catch(e){}
              setTimeout(fit,350);setTimeout(fit,1200);
            });
            window.addEventListener('resize',fit);
          })();
          </script>
          """
          anchor='<nav class="course-links" aria-label="课程导航">'
          assert html.count(anchor)==1
          html=html.replace(anchor,autosize+'\n'+anchor,1)
          assert 'id="combinedLesson2Frame"' in html and 'srcdoc="' not in html[html.index('id="combinedLesson2Frame"'):html.index('id="combinedLesson2Frame"')+500]
          assert 'audio/alphabet-natural/' in html and 'bathrobe-white.webp' in html
          file.write_text(html,encoding='utf-8')
          print('Fixed reading continuation: removed',len(original),'chars of giant iframe srcdoc. Preserved alphabet audio, images and layout.')
          PY
      - name: Commit only the repaired alphabet page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russian_lesson_1_COMPLETE.html
          git diff --cached --exit-code -- index.html
          git commit -m "Load lesson 2 reading content reliably after alphabet on mobile"
          git push
