name: Generate lesson 4 comprehension voices
on:
  push:
    branches:
      - feature/lesson4-comprehension-voices-20261022
    paths:
      - .github/workflows/lesson4-comprehension-audio.yml
      - scripts/generate_lesson4_comprehension_audio.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the working branch
        uses: actions/checkout@v4
        with:
          ref: feature/lesson4-comprehension-voices-20261022
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice generator
        run: python -m pip install --disable-pip-version-check "edge-tts>=7.0,<9"
      - name: Create and verify four exact Russian MP3s
        run: python scripts/generate_lesson4_comprehension_audio.py
      - name: Commit generated voices to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/lesson4-comprehension/*.mp3 assets/lesson4-final-audio.js
          if git diff --cached --quiet; then
            echo "No audio changes found"
          else
            git commit -m "Add four Dmitry and Svetlana lesson 4 MP3 voices"
            git push origin HEAD:feature/lesson4-comprehension-voices-20261022
          fi
