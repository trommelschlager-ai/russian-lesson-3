name: Import approved homepage visual
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-approved-homepage.yml'
permissions:
  contents: write
jobs:
  import-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved image and publish
        env:
          CANVA_IMAGE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F500670bc-a0bb-4919-a4ff-4329aa9a630b/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAJm_r5CCukE9rwgV318EN0whlO0Us94oYfGP0UZ4jwVq&exp=1792554440&osig=AAAAAAAAAAAAAAAAAAAAAB6n-2Oz6LQbjQprNtx8xL6uUMHNVxY91-4BEbxMkgs0&signer=media-rpc&token=AAIAAU0AJDUwMDY3MGJjLWEwYmItNDkxOS1hNGZmLTQzMjlhYTlhNjMwYgAAAAABoVySFUArjkMC5IkHenRYzTiraZ5oizJpcxNUQ4MT8f3mRbl-Sg&x-canva-quality=thumbnail"
        run: |
          python - <<'PY'
          import requests
          from PIL import Image
          from io import BytesIO
          import os,sys
          original=os.environ['CANVA_IMAGE_URL']
          candidates=[]
          for quality in ['quality:100','quality:80']:
              candidates.append(original.replace('/height:200/','/height:1672/').replace('/width:112','/width:941').replace('x-canva-quality=thumbnail','x-canva-quality=original').replace('quality:100',quality))
          candidates.append(original)
          good=None
          for url in candidates:
              try:
                  r=requests.get(url,timeout=20)
                  r.raise_for_status()
                  im=Image.open(BytesIO(r.content)).convert('RGB')
                  print('Fetched image',im.size, len(r.content))
                  if im.width >= 800 and im.height >= 1400:
                      good=im
                      break
              except Exception as exc:
                  print('Download attempt failed:',str(exc)[:300])
          if good is None:
              raise RuntimeError('No full-resolution approved image available; homepage unchanged')
          good.save('approved-homepage.webp',format='WEBP',quality=91,method=6)
          print('Saved approved-homepage.webp', os.path.getsize('approved-homepage.webp'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-homepage.webp
          git diff --cached --quiet || (git commit -m "Store approved full-resolution course homepage image" && git push)
