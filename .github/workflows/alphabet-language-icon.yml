name: Correct alphabet illustration semantics (staging)
on:
  push:
    branches:
      - course-recovery-2026-10-16
    paths:
      - QA_FIX_LANGUAGE_ICON.txt
permissions:
  contents: write
jobs:
  fix-language-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make one precise correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('russian_lesson_1_COMPLETE.html')
          original = path.read_text(encoding='utf-8')
          old = '"emoji":"👅","word":"Язык","lat":"Yazyk","zh":"语言"'
          new = '"emoji":"🗣️","word":"Язык","lat":"Yazyk","zh":"语言"'
          assert original.count(old) == 1, 'Expected exactly one matching language illustration'
          assert Path('index.html').is_file(), 'Homepage is missing'
          path.write_text(original.replace(old, new), encoding='utf-8')
          print('Changed only language illustration, preserved language text and layout')
          PY
      - name: Commit only lesson 1 file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russian_lesson_1_COMPLETE.html
          git diff --cached --exit-code -- index.html
          git commit -m "Correct Язык (语言) illustration without altering lesson layout"
          git push
