name: Add speaking practice to lesson 1 (safe patch)
on:
  push:
    branches: [feature/speech-check-all-seven-2026-10-19]
    paths:
      - .github/workflows/inject-lesson1-speech.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged homepage before patch
        run: |
          git diff --exit-code HEAD -- index.html
          test -f assets/pronunciation-check.js
          test -f assets/pronunciation-lesson1-data.js
      - name: Append speaking practice hook only to lesson 1
        run: node tools/inject-lesson1-speech.mjs
      - name: Confirm only lesson 1 is modified and commit
        run: |
          git diff --check
          git diff --exit-code -- index.html
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "russian_lesson_1_COMPLETE.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russian_lesson_1_COMPLETE.html
          git commit -m "Embed optional speaking practice in lesson 1 without redesign"
          git push origin HEAD:feature/speech-check-all-seven-2026-10-19
