<div class="app">
<header class="head">
  <div class="headtop"><a class="back" href="account-demo.html" aria-label="返回学习中心">‹</a><div class="brand">俄语学习中心<small>Русский для китайцев</small></div><span class="tag">第 1 / 7 课</span></div>
  <div class="introline">第1课 <strong>俄语字母表 · Алфавит</strong></div>
</header>
<main>
<nav class="tabs" aria-label="学习步骤"><button class="tab active" data-view="alphabet">① 字母</button><button class="tab" data-view="words">② 单词</button><button class="tab" data-view="quiz">③ 测验</button></nav>
<section id="alphabet" class="view show">
 <div class="rowhead"><div><h2>33 个俄语字母</h2><small>点击字母，听发音</small></div><span id="heardCount" class="tinycount">0 / 33</span></div>
 <div class="alpha" id="alphabetGrid"></div>
 <div class="focus">
  <div class="focusglyph"><span id="selectedUpper">А</span><small id="selectedLower">а</small></div>
  <div class="focuscopy">
  <div class="focusread"><b id="selectedName">字母名称：а</b><span class="latin" id="selectedLatin" aria-label="拉丁读音提示">A</span></div>
  <div class="focushand"><span>手写示例</span><strong class="handwriting" id="selectedHandwriting" lang="ru">Аа</strong></div>
  <small id="selectedHint">点击右侧按钮重听</small>
 </div>
  <button id="replayLetter" class="roundplay" aria-label="重听字母">🔊</button>
 </div>
 <p class="note">Ъ / Ь 不单独发音 · 拉丁拼写为近似读音提示</p>
 <p id="alphabetStatus" class="status" role="status" aria-live="polite"></p>
 <button class="cta" id="goWords">下一步：学习单词 →</button>
</section>
<section id="words" class="view">
 <div class="rowhead"><div><h2>单词 · Слова</h2><small>每个字母 4 个例词，共 132 个</small></div><span id="wordCount" class="tinycount">1 / 33</span></div>
 <div class="wordsnav"><button class="navbutton" id="previousGroup" aria-label="上一个字母">‹</button><select class="pick" id="letterSelect" aria-label="选择字母"></select><button class="navbutton" id="nextGroup" aria-label="下一个字母">›</button></div>
 <p class="signTip" id="specialWordTip" hidden>Ъ、Ь 和 Ы 一般不在词首；请注意它们在单词中的位置。</p>
 <div class="wordcards" id="wordCards"></div>
 <p id="wordsStatus" class="status" role="status" aria-live="polite">点击单词即可听录音。</p>
 <div class="bottomactions"><button id="backAlphabet" class="secondary">← 字母</button><button id="goQuiz" class="cta">听力测验 →</button></div>
</section>
<section id="quiz" class="view">
 <div class="rowhead"><div><h2>听力小测验</h2><small>听字母，选正确答案</small></div><span class="tinycount">6 题</span></div>
 <div class="quizcard" id="quizCard">
  <div id="questionNumber" class="quizcount">第 1 / 6 题</div>
  <div class="quizprompt">听一听，选一选</div>
  <button id="playQuestion" class="quizlisten" aria-label="播放字母读音">🔊</button>
  <div class="options" id="options"></div>
  <div class="answer" id="answer" role="status" aria-live="polite"></div>
  <button id="nextQuestion" class="cta" disabled>下一题 →</button>
 </div>
 <div class="quizcard" id="quizResult" hidden>
  <div class="summary"><div class="summaryicon" id="resultIcon">🏆</div><h2 id="resultTitle">本次成绩</h2><div id="resultScore" class="summaryscore">0 / 6</div><p id="resultDesc"></p></div>
  <button id="retry" class="cta">再试一次</button>
  <button id="returnHome" class="secondary" style="width:100%;margin-top:10px">返回学习中心</button>
 </div>
 <div class="bottomactions"><button class="secondary" id="backWords">← 单词</button></div>
</section>

</main>
</div>

function markCourseComplete(){try{const course=JSON.parse(localStorage.getItem(COURSE_KEY)||"{}");if(!course["1"]||Number(course["1"].score)<33){course["1"]={score:33,total:33,date:new Date().toISOString()};localStorage.setItem(COURSE_KEY,JSON.stringify(course));}}catch(e){}}
function stopAudio(){if(nowPlaying){try{nowPlaying.pause();nowPlaying.currentTime=0;}catch(e){}nowPlaying=null;}}
function play(path,opts={}){stopAudio();const source=path+(path.includes("?")?"&":"?")+"audio="+encodeURIComponent(AUDIO_RELEASE);const audio=new Audio(source);nowPlaying=audio;audio.playbackRate=opts.speed||1;if("preservesPitch" in audio)audio.preservesPitch=true;audio.addEventListener("ended",()=>{if(nowPlaying===audio)nowPlaying=null;},{once:true});const status=opts.status?$(opts.status):null;if(status)status.textContent="🔊 "+(opts.label||"正在播放");audio.play().then(()=>{if(opts.heard){if(!saved.heard.includes(opts.heard)){saved.heard.push(opts.heard);persist();}}}).catch(()=>{if(status)status.textContent="音频播放失败，请检查网络连接。";});}
function show(view){stopAudio();document.querySelectorAll(".view").forEach(n=>n.classList.toggle("show",n.id===view));document.querySelectorAll(".tab").forEach(n=>{const active=n.dataset.view===view;n.classList.toggle("active",active);n.setAttribute("aria-current",active?"step":"false");});if(view==="words")renderWords();if(view==="quiz"&&!test.length)resetTest();window.scrollTo({top:0,behavior:"smooth"});}
const SCHOOL_HANDWRITTEN_A="<svg class=\"hand-a-svg\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 180 80\" role=\"img\" aria-label=\"Прописная большая А и строчная а\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3.35\">\n<path d=\"M 13 67 C 7 75 3 77 4 72 C 5 69 9 68 13 67 C 24 64 36 43 48 23 C 56 10 60 7 64 8 C 69 10 69 24 70 38 C 71 49 72 61 77 66 C 81 70 86 66 89 60\"/>\n<path d=\"M 28 56 C 40 57 53 53 70 51\"/>\n<path d=\"M 117 35 C 103 30 98 43 101 54 C 104 69 122 67 125 51 C 127 42 125 36 117 35 Z\"/>\n<path d=\"M 128 35 C 123 50 124 65 130 69 C 137 73 146 65 151 59\"/>\n</g></svg>";
function renderHandwriting(letter){
  const target=$("selectedHandwriting");
  if(letter.l==="А"){target.innerHTML=SCHOOL_HANDWRITTEN_A;return;}
  target.replaceChildren();
  const upper=document.createElement("span");upper.className="script-upper";upper.textContent=letter.l;
  const lower=document.createElement("span");lower.className="script-lower";lower.textContent=letter.lo;
  target.append(upper,lower);
}
function selectLetter(i,playIt=true){selected=Math.max(0,Math.min(32,i));const d=DATA[selected];$("selectedUpper").textContent=d.l;$("selectedLower").textContent=d.lo;$("selectedName").textContent="字母名称："+d.name;$("selectedLatin").textContent=LATIN_NAMES[d.l];renderHandwriting(d);$("selectedHint").textContent=SIGNS.has(d.l)?"不单独发音":"点击重听字母名称";document.querySelectorAll("#alphabetGrid button").forEach(b=>b.classList.toggle("selected",b.dataset.letter===d.l));persist();if(playIt)play(d.letterAudio,{heard:d.l,status:"alphabetStatus",label:d.name});}
function setup(){const g=$("alphabetGrid"),sel=$("letterSelect");DATA.forEach((d,i)=>{const b=document.createElement("button");b.dataset.letter=d.l;b.setAttribute("aria-label","播放字母 "+d.l);if(SIGNS.has(d.l))b.classList.add("special");const strong=document.createElement("strong");strong.textContent=d.l;const small=document.createElement("small");small.textContent=d.lo;b.append(strong,small);b.addEventListener("click",()=>selectLetter(i));g.append(b);const o=document.createElement("option");o.value=String(i);o.textContent=d.l+" "+d.lo;sel.append(o);});updateHeard();selectLetter(selected,false);}
function renderWords(){
const d=DATA[group];
$("letterSelect").value=String(group);
$("wordCount").textContent=(group+1)+" / 33";
$("previousGroup").disabled=group===0;
$("nextGroup").disabled=group===32;
$("specialWordTip").hidden=!["Ъ","Ы","Ь"].includes(d.l);
const all=[{word:d.word,zh:d.zh,audio:d.wordAudio},...EXTRAS[group]];
const cardRoot=$("wordCards");
cardRoot.replaceChildren();
const updateWordProgress=()=>{
 let n=all.filter(x=>saved.wordHeard.includes(x.audio)).length;
 $("wordsStatus").textContent="已听："+n+" / 4 · 点击单词可重复播放";
 cardRoot.querySelectorAll("button").forEach(b=>b.classList.toggle("heard-word",saved.wordHeard.includes(b.dataset.audio)));
};
all.forEach((x,i)=>{
 const b=document.createElement("button");b.className="wordcard";
 b.dataset.audio=x.audio;
 b.setAttribute("aria-label","听单词 "+x.word);
 const w=document.createElement("b");w.textContent=x.word;
 const z=document.createElement("small");z.textContent=x.zh;
 const sound=document.createElement("span");sound.textContent="🔊 听发音";
 b.append(w,z,sound);
 b.addEventListener("click",()=>{
   play(x.audio,{status:"wordsStatus",label:x.word});
   if(!saved.wordHeard.includes(x.audio)){saved.wordHeard.push(x.audio);persist();}
   updateWordProgress();
 });
 cardRoot.append(b);
});
updateWordProgress();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function resetTest(){test=shuffle(DATA.filter(x=>!SIGNS.has(x.l)).slice()).slice(0,6);q=0;score=0;answered=false;$("quizCard").hidden=false;$("quizResult").hidden=true;showQuestion();}
function showQuestion(){if(q>=6){endTest();return;}answered=false;$("questionNumber").textContent="第 "+(q+1)+" / 6 题";$("answer").textContent="";$("nextQuestion").disabled=true;$("nextQuestion").textContent=q===5?"查看成绩 →":"下一题 →";const actual=test[q];const others=shuffle(DATA.filter(x=>!SIGNS.has(x.l)&&x.l!==actual.l)).slice(0,2);const options=shuffle([actual,...others]);const el=$("options");el.replaceChildren();options.forEach(d=>{const b=document.createElement("button");b.textContent=d.l;b.setAttribute("aria-label","字母 "+d.l);b.addEventListener("click",()=>{if(answered)return;answered=true;const ok=d.l===actual.l;if(ok)score++;$("answer").textContent=ok?"✅ 正确！":"正确答案："+actual.l;el.querySelectorAll("button").forEach(btn=>{btn.disabled=true;if(btn.textContent===actual.l)btn.classList.add("correct");else if(btn===b)btn.classList.add("wrong");});$("nextQuestion").disabled=false;});el.append(b);});}
function endTest(){saved.lastScore=score;if(score>=5)saved.quizPassed=true;persist();$("quizCard").hidden=true;$("quizResult").hidden=false;const pass=score>=5;$("resultIcon").textContent=pass?"🏆":"📖";$("resultTitle").textContent=pass?"做得好！":"再练习一下";$("resultScore").textContent=score+" / 6";$("resultDesc").textContent=(pass?"通过测验。":"再听几遍字母，争取答对至少5题。")+" 已听字母："+saved.heard.length+"/33。"+(saved.heard.length===33&&saved.quizPassed?"第1课已完成！":"听完全部33个字母并通过测验后，第1课会标记为完成。");}
$("replayLetter").addEventListener("click",()=>selectLetter(selected));
$("goWords").addEventListener("click",()=>show("words"));
$("backAlphabet").addEventListener("click",()=>show("alphabet"));
$("goQuiz").addEventListener("click",()=>{resetTest();show("quiz");});
$("backWords").addEventListener("click",()=>show("words"));
$("previousGroup").addEventListener("click",()=>{group=Math.max(0,group-1);renderWords();});
$("nextGroup").addEventListener("click",()=>{group=Math.min(32,group+1);renderWords();});
$("letterSelect").addEventListener("change",e=>{group=Number(e.target.value)||0;renderWords();});
$("playQuestion").addEventListener("click",()=>{if(!test.length)resetTest();play(test[q].letterAudio);});
$("nextQuestion").addEventListener("click",()=>{if(answered){q++;showQuestion();}});
$("retry").addEventListener("click",()=>{resetTest();show("quiz");});
$("returnHome").addEventListener("click",()=>location.assign("account-demo.html"));
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));
window.addEventListener("pagehide",stopAudio);
setup();
</script>
</body>
</html>
