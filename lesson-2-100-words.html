<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二课 · 100个简单俄语单词</title><link rel="stylesheet" href="assets/lesson2-rebuild.css"></head><body>
<header class="banner"><div class="brand"><strong>俄语零基础入门</strong><span>从零开始，轻松学会俄语！</span></div><h1>第二课<small>100个简单俄语单词</small></h1></header>
<div class="layout">
<main class="lesson"><div class="topline"><span>第 <b id="ordinal">01</b> 个单词 / 共 100 个</span><span id="voice" class="voice"></span></div><div class="learning"><div class="portrait"><img id="photo" alt=""><span id="photo-caption"></span><img class="frame" src="assets/lesson2-art/photo-frame-reference.webp" alt=""></div><section class="info"><div class="wordline"><h2 id="word" lang="ru"></h2><button id="small-play" class="round" aria-label="听原音"><img src="assets/lesson2-icons/speaker-high-white.svg" alt=""></button></div><div class="translation"><span id="latin"></span> · <strong id="zh"></strong></div><p class="hint"><img src="assets/lesson2-icons/lightbulb.svg" alt="">按音节朗读 · <em>红色表示重音</em></p><div id="syllables" lang="ru"></div></section></div>
<div class="actions"><button class="action blue" id="play"><img src="assets/lesson2-icons/speaker-high-white.svg" alt=""><span>听原音<small>标准发音</small></span></button><button class="action orange" id="slow"><img src="assets/lesson2-icons/clock-white.svg" alt=""><span>慢速听<small>0.7倍速度</small></span></button><button class="action pink" id="record"><img src="assets/lesson2-icons/microphone-white.svg" alt=""><span>我来读<small>语音识别</small></span></button></div>
<div id="feedback" class="feedback" role="status"><img id="status-icon" src="assets/lesson2-icons/speaker-high.svg" alt=""><div><strong id="status-title">先听原音，再跟读</strong><span id="status-copy">语音识别检查文字，不能判断重音是否正确。</span></div><button id="retry"><img src="assets/lesson2-icons/arrow-clockwise.svg" alt=""><span>再试一次<small>请大声朗读</small></span></button></div>
<div class="navigation"><button id="prev"><img src="assets/lesson2-icons/caret-left.svg" alt="">上一个单词</button><span id="count">1 / 100</span><button id="next">下一个单词<img src="assets/lesson2-icons/caret-right.svg" alt=""></button></div></main><aside class="catalog panel"><h2><img src="assets/lesson2-icons/book-open.svg" alt="">单词目录</h2><nav id="words" aria-label="单词目录"></nav></aside>
<aside class="guidance"><section class="panel steps"><h2><img src="assets/lesson2-icons/graduation-cap.svg" alt="">怎样学习？</h2><div id="steps"></div></section><section class="panel progress"><h2><img src="assets/lesson2-icons/trophy-gold.svg" alt="">我的学习进度</h2><div class="progressbar"><div id="fill"></div><b id="progress-label">1 / 100</b><strong id="percent">1%</strong></div><div class="stats"><div><b id="seen">1</b>已学习</div><div><b id="good">0</b>文字一致</div><div><b id="review">0</b>需要复习</div></div></section><section class="panel tips"><h2><img src="assets/lesson2-icons/lightbulb.svg" alt="">今日小提示</h2><ul><li>注意红色的重音</li><li>先听几遍，再跟读</li><li>尽量大声，声音清晰</li><li>每天学习 10–20 个单词</li><li>文字一致不代表重音正确</li></ul></section></aside></div><footer></footer><audio id="audio" preload="none"></audio><script src="assets/lesson2-rebuild.js"></script></body></html>
