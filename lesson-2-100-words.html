<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二课 · 100个简单俄语单词</title><link rel="stylesheet" href="assets/lesson2-rebuild.css"><link rel="stylesheet" href="assets/lesson2-vertical.css"></head><body>
<header class="banner"><div class="brand"><strong>俄语零基础入门</strong><span>从零开始，轻松学会俄语！</span></div><h1>第二课<small>100个简单俄语单词</small></h1></header>
<template id="word-template"><article class="lesson word-card"><div class="topline"><span>第 <b data-role="ordinal">01</b> 个单词 / 共 100 个</span><span data-role="voice" class="voice"></span></div><div class="learning"><div class="portrait"><img data-role="photo" alt=""><span data-role="photo-caption"></span><img class="frame" src="assets/lesson2-art/photo-frame-reference.webp" alt=""></div><section class="info"><div class="wordline"><h2 data-role="word" lang="ru"></h2><button data-role="small-play" class="round" aria-label="听原音"><img src="assets/lesson2-icons/speaker-high-white.svg" alt=""></button></div><div class="translation"><span data-role="latin"></span> · <strong data-role="zh"></strong></div><p class="hint"><img src="assets/lesson2-icons/lightbulb.svg" alt="">按音节朗读 · <em>红色表示重音</em></p><div data-role="syllables" lang="ru"></div></section></div>

</article></template>
<div class="layout"><div id="word-list" class="word-list" aria-label="100个俄语单词，向下滚动学习"></div><aside class="guidance"><section class="panel steps"><h2><img src="assets/lesson2-icons/graduation-cap.svg" alt="">怎样学习？</h2><div id="steps"></div></section><section class="panel progress"><h2><img src="assets/lesson2-icons/trophy-gold.svg" alt="">我的学习进度</h2><div class="progressbar"><div id="fill"></div><b id="progress-label">1 / 100</b><strong id="percent">1%</strong></div><div class="stats"><div><b id="seen">1</b>已学习</div><div><b id="good">0</b>文字一致</div><div><b id="review">0</b>需要复习</div></div></section><section class="panel tips"><h2><img src="assets/lesson2-icons/lightbulb.svg" alt="">今日小提示</h2><ul><li>注意红色的重音</li><li>先听几遍，再跟读</li><li>尽量大声，声音清晰</li><li>每天学习 10–20 个单词</li><li>文字一致不代表重音正确</li></ul></section></aside></div><footer></footer><audio id="audio" preload="none"></audio><script src="assets/lesson2-vertical.js"></script></body></html>
