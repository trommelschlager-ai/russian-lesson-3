<header class="banner l2-final-hero"><img src="assets/lesson2-birch/approved-reference.jpg" width="1024" height="1536" alt="第二课 · Урок 2 · 100个简单俄语单词 · 100 простых русских слов" fetchpriority="high" decoding="async"></header>

<div class="layout"><div id="word-list" class="word-list" aria-label="100个俄语单词，向下滚动学习"></div><aside class="guidance"><section class="panel steps"><h2><img src="assets/lesson2-icons/graduation-cap.svg" alt="">怎样学习？</h2><div id="steps"></div></section><section class="panel progress"><h2><img src="assets/lesson2-icons/trophy-gold.svg" alt="">我的学习进度</h2><div class="progressbar"><div id="fill"></div><b id="progress-label">1 / 100</b><strong id="percent">1%</strong></div><div class="stats"><div><b id="seen">1</b>已学习</div><div><b id="good">0</b>文字一致</div><div><b id="review">0</b>需要复习</div></div></section><section class="panel tips"><h2><img src="assets/lesson2-icons/lightbulb.svg" alt="">今日小提示</h2><ul><li>注意红色的重音</li><li>先听几遍，再跟读</li><li>尽量大声，声音清晰</li><li>每天学习 10–20 个单词</li><li>文字一致不代表重音正确</li></ul></section></aside></div><footer></footer><audio id="audio" preload="none"></audio><script src="assets/lesson2-vertical.js"></script><script>

(()=>{
 const list=document.getElementById('word-list');
 const stepCopy=['点击绿色按钮，听标准发音','点击珊瑚色按钮，听慢速发音','点击青色麦克风按钮，大声朗读'];

 });
})();
